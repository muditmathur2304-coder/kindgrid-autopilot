name: KindGrid BakeSlot FREE — Publish Verified Existing Draft and Q56
on:
  push:
    paths:
      - 'ops/bakeslot_free_publish_recovered_20261013.txt'
concurrency:
  group: kindgrid-publisher
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      PYTHONPATH: ${{ github.workspace }}
      GOOGLE_SERVICE_ACCOUNT_JSON_B64: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON_B64 }}
      GUMROAD_ACCESS_TOKEN: ${{ secrets.GUMROAD_ACCESS_TOKEN }}
      BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
      BUFFER_PINTEREST_CHANNEL_ID: ${{ secrets.BUFFER_PINTEREST_CHANNEL_ID }}
      BUFFER_ORGANIZATION_ID: ${{ secrets.BUFFER_ORGANIZATION_ID }}
      CLOUDINARY_URL: ${{ secrets.CLOUDINARY_URL }}
      LIVE_MODE: ${{ vars.AUTOPILOT_LIVE_ENABLED == 'true' && vars.AUTOPILOT_PAUSED != 'true' && 'true' || 'false' }}
      BAKESLOT_FREE_OWNER_RELEASE: 'true'
      PIN_AUTOSCHEDULE: 'false'
      GUMROAD_CREATE_DRAFTS: 'false'
      GUMROAD_AUTOPUBLISH: 'false'
      PAIRED_RELEASE_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install pinned requirements
        run: python -m pip install -r requirements.txt
      - name: Verify Python imports
        run: python -m compileall -q src scripts
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.4'
          cache: false
      - name: Install existing pinned Gumroad seller CLI
        run: |
          go install github.com/antiwork/gumroad-cli/cmd/gumroad@v0.20261002.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Publish ONLY the existing two-file BakeSlot draft after readback
        run: python -m scripts.bakeslot_free_publish_existing_draft
      - name: Share owner-approved Q56 on Pinterest only after public Gumroad verification
        run: python -m scripts.one_time_bakeslot_free_pin

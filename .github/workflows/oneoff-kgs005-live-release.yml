name: KindGrid KGS-005 One-Time Product + Pin
on:
  push:
    branches: [main]
    paths:
      - "scripts/oneoff_kgs005_release.py"
permissions:
  contents: read
concurrency:
  group: kindgrid-publisher
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'muditmathur2304-coder/kindgrid-autopilot'
    runs-on: ubuntu-latest
    timeout-minutes: 16
    env:
      GOOGLE_SERVICE_ACCOUNT_JSON_B64: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON_B64 }}
      GUMROAD_ACCESS_TOKEN: ${{ secrets.GUMROAD_ACCESS_TOKEN }}
      BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
      BUFFER_ORGANIZATION_ID: ${{ secrets.BUFFER_ORGANIZATION_ID }}
      BUFFER_PINTEREST_CHANNEL_ID: ${{ secrets.BUFFER_PINTEREST_CHANNEL_ID }}
      CLOUDINARY_URL: ${{ secrets.CLOUDINARY_URL }}
      KINDGRID_KGS005_OWNER_AUTHORIZED_ONETIME: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned dependencies
        run: python -m pip install -r requirements.txt
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.4'
          cache: false
      - name: Install previously proven Gumroad seller CLI
        run: |
          go install github.com/antiwork/gumroad-cli/cmd/gumroad@v0.20261002.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Release KGS-005 and schedule Q-44 exactly once
        run: python scripts/oneoff_kgs005_release.py
      - name: Preserve exact one-time proof and source downloads
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kindgrid-kgs005-publishing-proof
          path: kindgrid-kgs005-release-proof/
          if-no-files-found: ignore
          retention-days: 21

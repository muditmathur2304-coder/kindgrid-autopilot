name: KindGrid KG-PAIR-001 Reconciled Draft Completion
on:
  push:
    branches: [main]
    paths:
      - "scripts/oneoff_pair001_resume.py"
permissions:
  contents: read
concurrency:
  group: kindgrid-publisher
  cancel-in-progress: false
jobs:
  launch:
    if: github.repository == 'muditmathur2304-coder/kindgrid-autopilot'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      GOOGLE_SERVICE_ACCOUNT_JSON_B64: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON_B64 }}
      GUMROAD_ACCESS_TOKEN: ${{ secrets.GUMROAD_ACCESS_TOKEN }}
      BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
      BUFFER_ORGANIZATION_ID: ${{ secrets.BUFFER_ORGANIZATION_ID }}
      BUFFER_PINTEREST_CHANNEL_ID: ${{ secrets.BUFFER_PINTEREST_CHANNEL_ID }}
      CLOUDINARY_URL: ${{ secrets.CLOUDINARY_URL }}
      KINDGRID_OWNER_AUTHORIZED_PAIR001: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.4'
          cache: false
      - name: Install seller CLI used by prior verified KindGrid launches
        run: |
          go install github.com/antiwork/gumroad-cli/cmd/gumroad@v0.20261002.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Complete verified paid draft, publish linked freebie, schedule 3 pins
        run: python scripts/oneoff_pair001_resume.py
      - name: Preserve record for uncertain-state reconciliation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kindgrid-pair001-resume-receipt
          path: kindgrid-pair001-proof/
          if-no-files-found: ignore
          retention-days: 21

name: KindGrid Verify Q-44 Pinterest Delivery
on:
  workflow_dispatch: # Archived one-time verifier; job disabled
permissions:
  contents: read
jobs:
  verify:
    if: false # Q-44 already verified PUBLISHED; do not rerun
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      GOOGLE_SERVICE_ACCOUNT_JSON_B64: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON_B64 }}
      BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
      BUFFER_ORGANIZATION_ID: ${{ secrets.BUFFER_ORGANIZATION_ID }}
      BUFFER_PINTEREST_CHANNEL_ID: ${{ secrets.BUFFER_PINTEREST_CHANNEL_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Verify delivered Pinterest URL without posting
        run: python scripts/verify_q44_once.py

name: KindGrid KGS019 Exact Seller State Read Only
on:
  push:
    branches: [main]
    paths:
      - scripts/kgs019_readonly_reconcile.py
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PYTHONPATH: ${{ github.workspace }}
      GUMROAD_ACCESS_TOKEN: ${{ secrets.GUMROAD_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests Pillow pypdf 'reportlab>=4,<5'
      - run: python scripts/kgs019_readonly_reconcile.py

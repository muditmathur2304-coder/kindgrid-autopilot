name: KindGrid KG-PAIR-002 Owner-Authorized Live Launch
on:
  push:
    branches: [main]
    paths:
      - "scripts/launch_pair002_now.py"
permissions:
  contents: read
concurrency:
  group: kindgrid-publisher
  cancel-in-progress: false
jobs:
  paired-launch:
    if: github.repository == 'muditmathur2304-coder/kindgrid-autopilot'
    runs-on: ubuntu-latest
    timeout-minutes: 17
    env:
      GOOGLE_SERVICE_ACCOUNT_JSON_B64: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON_B64 }}
      GUMROAD_ACCESS_TOKEN: ${{ secrets.GUMROAD_ACCESS_TOKEN }}
      BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
      BUFFER_ORGANIZATION_ID: ${{ secrets.BUFFER_ORGANIZATION_ID }}
      BUFFER_PINTEREST_CHANNEL_ID: ${{ secrets.BUFFER_PINTEREST_CHANNEL_ID }}
      CLOUDINARY_URL: ${{ secrets.CLOUDINARY_URL }}
      LIVE_MODE: 'true'
      PAIRED_RELEASE_ENABLED: 'true'
      KINDGRID_OWNER_APPROVED_PAIR002: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install publishing dependencies
        run: python -m pip install -r requirements.txt
      - name: Validate safety regressions
        run: python -m unittest discover -s tests -v
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.4'
          cache: false
      - name: Install pinned Gumroad seller tool
        run: |
          go install github.com/antiwork/gumroad-cli/cmd/gumroad@v0.20261002.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Launch one approved paid-free pair, then schedule three distinct Pins
        run: python scripts/launch_pair002_now.py

name: KindGrid CollectFlow KGS013 one-time owner-approved release
on:
  push:
    paths:
      - 'ops/collectflow_kgs013_release_20261013.txt'
concurrency:
  group: kindgrid-publisher
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  seller-and-pin:
    runs-on: ubuntu-latest
    timeout-minutes: 17
    env:
      PYTHONPATH: ${{ github.workspace }}
      GOOGLE_SERVICE_ACCOUNT_JSON_B64: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON_B64 }}
      GUMROAD_ACCESS_TOKEN: ${{ secrets.GUMROAD_ACCESS_TOKEN }}
      BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
      BUFFER_PINTEREST_CHANNEL_ID: ${{ secrets.BUFFER_PINTEREST_CHANNEL_ID }}
      BUFFER_ORGANIZATION_ID: ${{ secrets.BUFFER_ORGANIZATION_ID }}
      CLOUDINARY_URL: ${{ secrets.CLOUDINARY_URL }}
      LIVE_MODE: ${{ vars.AUTOPILOT_LIVE_ENABLED == 'true' && vars.AUTOPILOT_PAUSED != 'true' && 'true' || 'false' }}
      PIN_AUTOSCHEDULE: 'true'
      PIN_LOOKAHEAD_HOURS: '36'
      PIN_DAILY_LIMIT: '7'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Record safe preflight start in seller queue
        run: |
          python - <<'PY'
          from src.autopilot import GoogleStore, make_timestamp
          store = GoogleStore()
          rows = [r for r in store.get_rows('Gumroad Upload Queue') if r.get('Product ID') == 'KGS-013']
          if len(rows) != 1:
              raise RuntimeError('KGS-013 queue row missing')
          if rows[0].get('Upload Status') == 'RELEASE_APPROVED_ONCE':
              store.patch('Gumroad Upload Queue', rows[0], {'Last Error': 'RUNNER_PREFLIGHT_STARTED ' + make_timestamp()})
          print('OWNER_RELEASE_RUNNER_STARTED, not yet a seller write')
          PY
      - name: Release regression tests
        run: python -m unittest discover -s tests -v
      - name: Record regression test PASS checkpoint
        run: |
          python - <<'PY'
          from src.autopilot import GoogleStore, make_timestamp
          s=GoogleStore(); row=next(r for r in s.get_rows('Gumroad Upload Queue') if r.get('Product ID')=='KGS-013')
          if row.get('Upload Status')=='RELEASE_APPROVED_ONCE':
              s.patch('Gumroad Upload Queue',row,{'Last Error':'RUNNER_TESTS_PASSED '+make_timestamp()})
          print('TESTS_PASSED; no Gumroad write attempted')
          PY
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.4'
          cache: false
      - name: Install pinned Gumroad CLI
        run: |
          go install github.com/antiwork/gumroad-cli/cmd/gumroad@v0.20261002.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Record CLI installed checkpoint
        run: |
          python - <<'PY'
          from src.autopilot import GoogleStore, make_timestamp
          s=GoogleStore(); row=next(r for r in s.get_rows('Gumroad Upload Queue') if r.get('Product ID')=='KGS-013')
          if row.get('Upload Status')=='RELEASE_APPROVED_ONCE':
              s.patch('Gumroad Upload Queue',row,{'Last Error':'RUNNER_SELLER_CLI_INSTALLED '+make_timestamp()})
          print('GUMROAD_CLI_INSTALLED; no seller write attempted yet')
          PY
      - name: One-time verified seller and Pinterest release
        run: python -m scripts.release_kgs013_once

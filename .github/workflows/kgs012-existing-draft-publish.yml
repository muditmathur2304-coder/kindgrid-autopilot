name: KindGrid KGS-012 publish RECONCILED existing draft only
on:
  push:
    paths:
      - 'ops/publish_kgs012_existing_draft_once.txt'
concurrency:
  group: kindgrid-publisher
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  exact-existing-draft:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    env:
      PYTHONPATH: ${{ github.workspace }}
      GOOGLE_SERVICE_ACCOUNT_JSON_B64: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON_B64 }}
      GUMROAD_ACCESS_TOKEN: ${{ secrets.GUMROAD_ACCESS_TOKEN }}
      LIVE_MODE: ${{ vars.AUTOPILOT_LIVE_ENABLED == 'true' && vars.AUTOPILOT_PAUSED != 'true' && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install requirements
        run: python -m pip install -r requirements.txt
      - name: Verify source and unit-test integrity
        run: |
          python -m compileall -q src scripts
          python -m unittest discover -s tests -v
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.4'
          cache: false
      - name: Install pinned Gumroad client
        run: |
          go install github.com/antiwork/gumroad-cli/cmd/gumroad@v0.20261002.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Publish existing confirmed KGS-012 ID only
        run: python -m scripts.publish_kgs012_existing_draft

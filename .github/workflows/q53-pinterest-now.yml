name: KindGrid Q53 Pinterest Publish Now
on:
  push:
    branches: [main]
    paths: [scripts/publish_q53_now_once.py]
permissions:
  contents: read
concurrency:
  group: kindgrid-publisher
  cancel-in-progress: false
jobs:
  one_pin_now:
    if: false # Completed one-time Pin; user requested scheduled-only publishing
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      KINDGRID_Q53_IMMEDIATE_OWNER_APPROVAL: 'true'
      GOOGLE_SERVICE_ACCOUNT_JSON_B64: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON_B64 }}
      BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
      BUFFER_ORGANIZATION_ID: ${{ secrets.BUFFER_ORGANIZATION_ID }}
      BUFFER_PINTEREST_CHANNEL_ID: ${{ secrets.BUFFER_PINTEREST_CHANNEL_ID }}
      CLOUDINARY_URL: ${{ secrets.CLOUDINARY_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run existing QA regression tests
        run: python -m unittest discover -s tests -q
      - name: Submit exactly one approved Q53 Pinterest post NOW
        run: python scripts/publish_q53_now_once.py

name: KindGrid KGS-012 seller reconciliation (READ ONLY)
on:
  push:
    paths:
      - 'ops/reconcile_kgs012_once.txt'
permissions:
  contents: read
jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GUMROAD_ACCESS_TOKEN: ${{ secrets.GUMROAD_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install read-only client
        run: python -m pip install requests
      - name: Check seller list only - never create, update or publish
        run: python -m scripts.reconcile_kgs012

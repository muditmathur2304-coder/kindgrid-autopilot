name: KGS014 Read Only Seller Reconciliation
on:
  push:
    branches: [main]
    paths: [scripts/reconcile_kgs014_readonly.py]
permissions: {contents: read}
concurrency: {group: kindgrid-publisher, cancel-in-progress: false}
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      GUMROAD_ACCESS_TOKEN: ${{ secrets.GUMROAD_ACCESS_TOKEN }}
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install -r requirements.txt
      - uses: actions/setup-go@v5
        with: {go-version: '1.25.4', cache: false}
      - run: |
          go install github.com/antiwork/gumroad-cli/cmd/gumroad@v0.20261002.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Inspect Gumroad listings and command flags without any writes
        run: python scripts/reconcile_kgs014_readonly.py

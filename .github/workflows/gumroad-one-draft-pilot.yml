name: Gumroad One-Draft Pilot
on:
  workflow_dispatch:
    inputs:
      confirm_live:
        description: "Create ONE NEW UNPUBLISHED technical test draft using copies of KGS-003 files? OFF = safe preview."
        type: boolean
        required: true
        default: false
permissions:
  contents: read
concurrency:
  group: kindgrid-publisher
  cancel-in-progress: false
jobs:
  gumroad-draft-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GOOGLE_SERVICE_ACCOUNT_JSON_B64: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON_B64 }}
      GUMROAD_ACCESS_TOKEN: ${{ secrets.GUMROAD_ACCESS_TOKEN }}
      GUMROAD_PILOT_CONFIRM_LIVE: ${{ inputs.confirm_live && 'true' || 'false' }}
      GUMROAD_AUTOPUBLISH: 'false'
      GUMROAD_CREATE_DRAFTS: 'false'
      PIN_AUTOSCHEDULE: 'false'
      LIVE_MODE: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Run unit tests and check pilot syntax
        run: |
          python -m unittest discover -s tests -v
          python -m py_compile scripts/gumroad_one_draft_pilot.py
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.4'
          cache: false
      - name: Install pinned Gumroad CLI
        run: |
          go install github.com/antiwork/gumroad-cli/cmd/gumroad@v0.20261002.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Gumroad pilot - preview unless explicitly approved
        run: python scripts/gumroad_one_draft_pilot.py

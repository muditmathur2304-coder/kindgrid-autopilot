name: Pinterest One-Pin Pilot
on:
  workflow_dispatch:
    inputs:
      confirm_live:
        description: "Actually schedule Q-02 on Pinterest via Buffer? Leave OFF for safe preview."
        type: boolean
        required: true
        default: false
permissions:
  contents: read
concurrency:
  group: kindgrid-publisher
  cancel-in-progress: false
jobs:
  one-pin-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      GOOGLE_SERVICE_ACCOUNT_JSON_B64: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON_B64 }}
      BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
      BUFFER_ORGANIZATION_ID: ${{ secrets.BUFFER_ORGANIZATION_ID }}
      BUFFER_PINTEREST_CHANNEL_ID: ${{ secrets.BUFFER_PINTEREST_CHANNEL_ID }}
      CLOUDINARY_URL: ${{ secrets.CLOUDINARY_URL }}
      PIN_PILOT_CONFIRM_LIVE: ${{ inputs.confirm_live && 'true' || 'false' }}
      LIVE_MODE: 'false'
      GUMROAD_CREATE_DRAFTS: 'false'
      GUMROAD_AUTOPUBLISH: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run safety tests
        run: python -m unittest discover -s tests -v
      - name: One Pin Q-02 only - dry run unless explicitly approved
        run: python scripts/pinterest_one_pin_pilot.py

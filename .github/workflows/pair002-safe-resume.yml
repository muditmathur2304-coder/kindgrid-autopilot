name: KindGrid KG-PAIR-002 Safe Resume
on:
  workflow_dispatch: # ARCHIVED / QA FAIL — disabled; never execute again
permissions:
  contents: read
concurrency:
  group: kindgrid-publisher
  cancel-in-progress: false
jobs:
  resume:
    if: false # source QA revoked for BOTH products; no Gumroad/Buffer writes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      KINDGRID_PAIR002_OWNER_RESUME: 'true'
      LIVE_MODE: 'true'
      PAIRED_RELEASE_ENABLED: 'true'
      GOOGLE_SERVICE_ACCOUNT_JSON_B64: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON_B64 }}
      GUMROAD_ACCESS_TOKEN: ${{ secrets.GUMROAD_ACCESS_TOKEN }}
      CLOUDINARY_URL: ${{ secrets.CLOUDINARY_URL }}
      BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
      BUFFER_ORGANIZATION_ID: ${{ secrets.BUFFER_ORGANIZATION_ID }}
      BUFFER_PINTEREST_CHANNEL_ID: ${{ secrets.BUFFER_PINTEREST_CHANNEL_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install publisher dependencies
        run: python -m pip install -r requirements.txt
      - name: Run 27+ safety tests
        run: python -m unittest discover -s tests -q
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.4'
          cache: false
      - name: Install verified Gumroad seller CLI
        run: |
          go install github.com/antiwork/gumroad-cli/cmd/gumroad@v0.20261002.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Reconcile and resume exact existing paid draft; free product only after public verification
        run: python scripts/resume_pair002_existing.py
      - name: Preserve bounded proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kgs-pair002-safe-resume-proof
          path: kindgrid-pair002-resume-proof/
          if-no-files-found: ignore
          retention-days: 21

name: KindGrid CollectFlow one-time read-only Gumroad reconciliation
on:
  push:
    paths:
      - 'ops/collectflow_readonly_reconcile_20261013.txt'
permissions:
  contents: read
concurrency:
  group: kindgrid-seller-readonly
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PYTHONPATH: ${{ github.workspace }}
      GOOGLE_SERVICE_ACCOUNT_JSON_B64: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON_B64 }}
      GUMROAD_ACCESS_TOKEN: ${{ secrets.GUMROAD_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Read-only seller inventory and exact CollectFlow slug lookup
        run: python -m scripts.reconcile_kgs013_readonly

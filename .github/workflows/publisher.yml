name: KindGrid Autopilot (2-hour quality-gated publisher)
on:
  schedule:
    - cron: '17 */2 * * *' # UTC even hours at :17; IST 05:47,07:47,...03:47; avoids top-of-hour GitHub schedule congestion
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Preview without any external writes (recommended)'
        required: true
        type: boolean
        default: true
  push:
    paths:
      - 'ops/owner_release_2026_10_16.txt' # one owner-authorized immediate release event; no added workflow
concurrency:
  group: kindgrid-publisher
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  publisher:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PYTHONPATH: ${{ github.workspace }} # Ensure src/ resolves regardless of entrypoint
      GOOGLE_SERVICE_ACCOUNT_JSON_B64: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON_B64 }}
      BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
      BUFFER_PINTEREST_CHANNEL_ID: ${{ secrets.BUFFER_PINTEREST_CHANNEL_ID }}
      BUFFER_ORGANIZATION_ID: ${{ secrets.BUFFER_ORGANIZATION_ID }}
      CLOUDINARY_URL: ${{ secrets.CLOUDINARY_URL }}
      GUMROAD_ACCESS_TOKEN: ${{ secrets.GUMROAD_ACCESS_TOKEN }}
      LIVE_MODE: ${{ (github.event_name == 'schedule' || (github.event_name == 'push' && github.event.head_commit.message == 'KINDGRID_OWNER_RELEASE_2026_10_16')) && vars.AUTOPILOT_LIVE_ENABLED == 'true' && vars.AUTOPILOT_PAUSED != 'true' && 'true' || 'false' }}
      PIN_AUTOSCHEDULE: 'true' # OWNER-APPROVED scheduled-only: publish only fully audited READY Pins; every other state is blocked
      GUMROAD_CREATE_DRAFTS: 'false' # QUALITY HOLD: old single-product creation path disabled
      GUMROAD_AUTOPUBLISH: 'false' # QUALITY HOLD: do not publish isolated/mediocre items
      PAIRED_RELEASE_ENABLED: 'true' # TWO-PRODUCT GATE ONLY: complete research-backed PAID+FREE pair or do nothing
      MAX_GUMROAD_PER_RUN: '2' # Pair uploader remains one audited PAID+FREE pair per run
      GUMROAD_DAILY_LIMIT: '7' # Max new confirmed public listings / New York day, never a forced target
      PIN_DAILY_LIMIT: '7' # Max distinct QA-approved Pinterest Pins / New York day
      MAX_PINS_PER_RUN: '7' # Buffer Free still permits only 10 TOTAL scheduled posts per channel
      PIN_LOOKAHEAD_HOURS: '36' # Rolling queue refills as Buffer posts leave its 10-post free queue
      DISPATCH_DRY_RUN: ${{ inputs.dry_run || 'false' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Unit tests
        env:
          PIN_LOOKAHEAD_HOURS: '72' # test fixtures use dates through 72h; runtime remains 36h
        run: python -m unittest discover -s tests -v
      - name: Verify Buffer connection (read only)
        if: github.event_name == 'workflow_dispatch'
        run: python scripts/check_buffer_connection.py
      - name: Verify Cloudinary connection (read only)
        if: github.event_name == 'workflow_dispatch'
        run: python scripts/check_cloudinary_connection.py
      - name: Verify Pinterest board and queue API (read only)
        if: github.event_name == 'workflow_dispatch'
        run: python scripts/check_pinterest_preflight.py
      - name: Verify Gumroad seller token and store (read only)
        if: github.event_name == 'workflow_dispatch' && env.GUMROAD_ACCESS_TOKEN != ''
        run: python scripts/check_gumroad_connection.py
      - name: Inspect staged premium tool files and Pinterest/Gumroad access (read only)
        continue-on-error: true
        run: python -m scripts.staged_pair_preflight
      - name: Check Python module imports and detect approved pairs (read only)
        id: gumroad_queue
        run: python -m scripts.check_pair_queue
      - uses: actions/setup-go@v5
        if: steps.gumroad_queue.outputs.needs_cli == 'true'
        with:
          go-version: '1.25.4'
          cache: false
      - name: Install pinned Gumroad CLI (only when both paired products are verified READY)
        if: steps.gumroad_queue.outputs.needs_cli == 'true'
        run: |
          go install github.com/antiwork/gumroad-cli/cmd/gumroad@v0.20261002.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Safe publishing pass
        run: python -m src.autopilot

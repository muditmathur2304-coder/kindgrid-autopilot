name: KindGrid KGS018 Read-only Seller State
on:
  push:
    branches: [main]
    paths:
      - scripts/kgs018_readonly_seller_check.py
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      GUMROAD_ACCESS_TOKEN: ${{ secrets.GUMROAD_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests
      - run: python scripts/kgs018_readonly_seller_check.py

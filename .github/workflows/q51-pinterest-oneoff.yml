name: KindGrid Q51 Pinterest One-Off
on:
  push:
    branches: [main]
    paths:
      - scripts/submit_q51_once.py
permissions:
  contents: read
concurrency:
  group: kindgrid-publisher
  cancel-in-progress: false
jobs:
  submit_q51:
    if: false # Completed one-time Pin; user requested scheduled-only publishing
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      KINDGRID_Q51_OWNER_APPROVED: 'true'
      GOOGLE_SERVICE_ACCOUNT_JSON_B64: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON_B64 }}
      BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
      BUFFER_ORGANIZATION_ID: ${{ secrets.BUFFER_ORGANIZATION_ID }}
      BUFFER_PINTEREST_CHANNEL_ID: ${{ secrets.BUFFER_PINTEREST_CHANNEL_ID }}
      CLOUDINARY_URL: ${{ secrets.CLOUDINARY_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install publisher requirements
        run: python -m pip install -r requirements.txt
      - name: Run safety tests
        run: python -m unittest discover -s tests -q
      - name: Schedule only audited Q51 through Buffer
        run: python scripts/submit_q51_once.py

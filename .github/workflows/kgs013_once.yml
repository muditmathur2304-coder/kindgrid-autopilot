name: KindGrid KGS-013 CollectFlow Owner One-Time Release
on:
  push:
    paths:
      - 'ops/kgs013_trigger.txt'
concurrency:
  group: kindgrid-publisher
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  collectflow:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: ${{ github.workspace }}
      GOOGLE_SERVICE_ACCOUNT_JSON_B64: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON_B64 }}
      BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
      BUFFER_PINTEREST_CHANNEL_ID: ${{ secrets.BUFFER_PINTEREST_CHANNEL_ID }}
      BUFFER_ORGANIZATION_ID: ${{ secrets.BUFFER_ORGANIZATION_ID }}
      CLOUDINARY_URL: ${{ secrets.CLOUDINARY_URL }}
      GUMROAD_ACCESS_TOKEN: ${{ secrets.GUMROAD_ACCESS_TOKEN }}
      LIVE_MODE: ${{ vars.AUTOPILOT_LIVE_ENABLED == 'true' && vars.AUTOPILOT_PAUSED != 'true' && 'true' || 'false' }}
      PIN_AUTOSCHEDULE: 'true'
      GUMROAD_CREATE_DRAFTS: 'false'
      GUMROAD_AUTOPUBLISH: 'false'
      PAIRED_RELEASE_ENABLED: 'false'
      PIN_DAILY_LIMIT: '7'
      GUMROAD_DAILY_LIMIT: '7'
      MAX_PINS_PER_RUN: '1'
      PIN_LOOKAHEAD_HOURS: '36'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Gate on all KindGrid regression tests
        run: python -m unittest discover -s tests -v
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.4'
          cache: false
      - name: Install pinned Gumroad CLI
        run: |
          go install github.com/antiwork/gumroad-cli/cmd/gumroad@v0.20261002.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Create/readback/publish CollectFlow only if all approved
        run: python -m scripts.kgs013_seller_once
      - name: Create exactly one original linked Pinterest post
        run: python -m scripts.kgs013_pin_once

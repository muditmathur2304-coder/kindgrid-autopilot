name: KindGrid Code Quality Checks
on:
  push:
    paths:
      - "src/**"
      - "tests/**"
      - "scripts/**"
      - ".github/workflows/**"
      - "requirements.txt"
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "scripts/**"
      - ".github/workflows/**"
      - "requirements.txt"
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install requirements
        run: python -m pip install -r requirements.txt
      - name: Verify syntax
        run: python -m compileall -q src scripts tests
      - name: Run publishing safety tests
        run: python -m unittest discover -s tests -v
      - name: Diagnose staged Gumroad, Pinterest and Drive permissions (READ ONLY, default-branch push only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        continue-on-error: true
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON_B64: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON_B64 }}
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_PINTEREST_CHANNEL_ID: ${{ secrets.BUFFER_PINTEREST_CHANNEL_ID }}
          BUFFER_ORGANIZATION_ID: ${{ secrets.BUFFER_ORGANIZATION_ID }}
          GUMROAD_ACCESS_TOKEN: ${{ secrets.GUMROAD_ACCESS_TOKEN }}
          LIVE_MODE: 'false'
        run: python -m scripts.staged_pair_preflight
      - name: Regression check scheduled publisher Python entrypoints (no external writes)
        env:
          LIVE_MODE: 'false'
          PAIRED_RELEASE_ENABLED: 'true'
          GOOGLE_SERVICE_ACCOUNT_JSON_B64: ''
        run: |
          python -m scripts.check_pair_queue
          python -m src.autopilot

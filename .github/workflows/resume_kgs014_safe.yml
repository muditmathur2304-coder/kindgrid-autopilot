name: KGS014 Resume Verified Existing Draft + Q59 Pinterest
on:
  workflow_dispatch: # Archived completed one-time proof; disabled job
permissions: {contents: read}
concurrency:
  group: kindgrid-publisher
  cancel-in-progress: false
jobs:
  resume:
    if: false # KGS014 and Q59 were successfully published; never rerun
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: ${{ github.workspace }}
      LIVE_MODE: 'true'
      KINDGRID_OWNER_RESUME_KGS014: 'true'
      GOOGLE_SERVICE_ACCOUNT_JSON_B64: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON_B64 }}
      GUMROAD_ACCESS_TOKEN: ${{ secrets.GUMROAD_ACCESS_TOKEN }}
      BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
      BUFFER_ORGANIZATION_ID: ${{ secrets.BUFFER_ORGANIZATION_ID }}
      BUFFER_PINTEREST_CHANNEL_ID: ${{ secrets.BUFFER_PINTEREST_CHANNEL_ID }}
      CLOUDINARY_URL: ${{ secrets.CLOUDINARY_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install -r requirements.txt
      - name: Safety tests
        run: python -m unittest discover -s tests -q
      - uses: actions/setup-go@v5
        with: {go-version: '1.25.4', cache: false}
      - run: |
          go install github.com/antiwork/gumroad-cli/cmd/gumroad@v0.20261002.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Publish ONLY verified preexisting seller draft then one new Pinterest Pin
        run: python scripts/resume_kgs014_existing_draft.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kgs014-safe-resume-proof
          path: kindgrid-kgs014-resume-proof/
          if-no-files-found: ignore
          retention-days: 21

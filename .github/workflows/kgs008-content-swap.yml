name: Finish KGS008 Old File Removal (No Upload)
on:
  push:
    branches: [main]
    paths: [scripts/complete_kgs008_content_swap.py]
permissions:
  contents: read
concurrency:
  group: kindgrid-publisher
  cancel-in-progress: false
jobs:
  swap:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      GUMROAD_ACCESS_TOKEN: ${{ secrets.GUMROAD_ACCESS_TOKEN }}
      GOOGLE_SERVICE_ACCOUNT_JSON_B64: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON_B64 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.4'
          cache: false
      - run: |
          go install github.com/antiwork/gumroad-cli/cmd/gumroad@v0.20261002.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Remove only known old Gumroad document embeddings, preserving both corrected files
        run: python scripts/complete_kgs008_content_swap.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kgs008-old-file-content-swap-proof
          path: kindgrid-kgs008-swap-proof/
          if-no-files-found: ignore
          retention-days: 14

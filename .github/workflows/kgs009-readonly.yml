name: Read-Only KGS009 Seller State
on:
  push:
    branches: [main]
    paths: [scripts/reconcile_kgs009_readonly.py]
permissions: {contents: read}
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      GUMROAD_ACCESS_TOKEN: ${{ secrets.GUMROAD_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install Python client dependencies
        run: python -m pip install -r requirements.txt
      - uses: actions/setup-go@v5
        with: {go-version: '1.25.4', cache: false}
      - name: Install Gumroad CLI
        run: |
          go install github.com/antiwork/gumroad-cli/cmd/gumroad@v0.20261002.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Inspect only
        run: python scripts/reconcile_kgs009_readonly.py
